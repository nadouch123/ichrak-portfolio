<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b1424" />
    <link rel="icon" href="/logo-mark.jpg" type="image/jpeg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Page not found | Ichrak Matrouh</title>
    <style>
      *{box-sizing:border-box}
      html,body{margin:0;min-height:100%}
      body{min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(900px 500px at 85% -10%,#1d3a6b 0%,transparent 60%),#0b1424;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.6}
      main{max-width:560px}
      .brand{display:inline-flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:600}
      .brand img{width:40px;height:40px;border-radius:12px;background:#fff}
      .code{margin:48px 0 8px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#9cc2ff}
      h1{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(40px,9vw,64px);line-height:1.02;margin:0;letter-spacing:-.02em}
      p{color:rgba(255,255,255,.75);font-size:17px}
      ul{list-style:none;padding:0;margin:28px 0 0;display:flex;flex-wrap:wrap;gap:10px}
      a.btn{display:inline-flex;align-items:center;height:46px;padding:0 20px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#fff;text-decoration:none;font-weight:600;font-size:15px}
      a.btn.primary{background:#fff;color:#0b1424;border-color:#fff}
      a.btn:hover{background:#9cc2ff;color:#0b1424;border-color:#9cc2ff}
      a:focus-visible{outline:2px solid #9cc2ff;outline-offset:3px}
      .path{word-break:break-all;color:#fff}
    </style>
    <!-- Vercel Web Analytics: cookieless page views, no personal data. -->
    <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <main>
      <a class="brand" href="/"><img src="/logo-mark.jpg" alt="" width="40" height="40" /> Ichrak Matrouh</a>
      <p class="code">404 · Page not found</p>
      <h1>This page doesn't exist.</h1>
      <p>The address <span class="path" id="path"></span> isn't a page on my portfolio. It may have been mistyped, or the link that sent you here is out of date.</p>
      <ul>
        <li><a class="btn primary" href="/">Go to the home page</a></li>
        <li><a class="btn" href="/#work">See my work</a></li>
        <li><a class="btn" href="/#contact">Contact me</a></li>
      </ul>
    </main>
    <script>document.getElementById('path').textContent = location.pathname;</script>
  </body>
</html>
