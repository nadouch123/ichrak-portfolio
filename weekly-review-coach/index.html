<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230b1424%22/%3E%3Cpath d=%22M9 17l4 4 10-10%22 stroke=%22%239cc2ff%22 stroke-width=%223%22 fill=%22none%22/%3E%3C/svg%3E" />
    <meta name="description" content="Weekly Review Coach: a Claude agent that reviews my internship week from my own notes, with tool results rendered as components." />
    <meta name="theme-color" content="#0b1424" />
    <!-- FE-10: fonts are self-hosted (no third-party round trip) and preloaded. The "Fallback" faces are
         Arial/Times resized to the real fonts' metrics, so text doesn't jump when the web fonts swap in. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/inter-latin-var.woff2) format('woff2')}
      @font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-latin.woff2) format('woff2')}
      @font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-latin-italic.woff2) format('woff2')}
      @font-face{font-family:'Inter Fallback';src:local('Arial'),local('ArialMT'),local('Liberation Sans');ascent-override:90.44%;descent-override:22.52%;line-gap-override:0%;size-adjust:107.12%}
      @font-face{font-family:'Instrument Serif Fallback';src:local('Times New Roman'),local('TimesNewRomanPSMT'),local('Liberation Serif');ascent-override:117.94%;descent-override:36.93%;line-gap-override:0%;size-adjust:83.94%}
    </style>
    <title>Weekly Review Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
